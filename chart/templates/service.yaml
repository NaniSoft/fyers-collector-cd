apiVersion: v1
kind: Service
metadata:
  name: {{ include "fyers-collector.fullname" . }}
  labels:
    {{- include "fyers-collector.name" . | nindent 4 }}
    app.kubernetes.io/component: collector
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: fyers-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    # Port MUST equal the one in FYERS_REDIRECT_URI: the Fyers app registration
    # is byte-exact. LoadBalancer publishes it on host loopback on Docker
    # Desktop; the VPS overlay switches to NodePort.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.port }}
      {{- end }}
