# values-local.yaml — the Docker Desktop cluster (the "docker system").
#
# Deploys the PUBLISHED image from GHCR; the tag comes from values.yaml (CI
# bumps it). Nothing here reads the app source checkout.
#
#   ./deploy.sh                 # secrets + helm install, published image
#
# For the inner dev loop (a locally-built image instead of the release):
#   docker build -t fyers-collector:local ../fyers-collector
#   ./deploy.sh install --set image.repository=fyers-collector --set image.tag=local

service:
  type: LoadBalancer          # Docker Desktop publishes host 127.0.0.1:8001

nodeSelector:
  kubernetes.io/hostname: desktop-worker   # the PV is pinned to its first consumer

# This release OWNS its claim (`fyers-collector-data`): a fresh PVC is created
# on install and removed on `helm uninstall`. That is safe here because the data
# is deliberately ephemeral — the nightly 23:15 job uploads the day to Drive and
# resets the volume.
storage:
  existingClaim: ""
  size: 10Gi
  fixPermissions: true        # a brand-new local-path dir is root-owned

rclone:
  enabled: true
  existingSecret: fyers-rclone
