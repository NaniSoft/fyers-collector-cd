name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: helm lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # config.yaml is committed (non-secret) — it is what the cluster runs.
      - name: Lint
        run: helm lint chart/ -f chart/values-local.yaml --set-file configYaml=config.yaml

      - name: Template (local overlay)
        run: helm template fyers chart/ -f chart/values-local.yaml --set-file configYaml=config.yaml >/dev/null

      - name: Template (vps overlay)
        run: helm template fyers chart/ -f chart/values-vps.yaml --set-file configYaml=config.yaml >/dev/null

      - name: Syntax-check deploy.sh
        run: sh -n deploy.sh
